name: Build feed

on:
  schedule:
    - cron: "30 */4 * * *" # every 4h at :30 UTC; edit to taste
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Curation bills through OpenRouter, matching the semidoped-news cloud
      # runner and the EA jobs. The direct Anthropic key is no longer used
      # here: it started returning a payload-independent 400 on 2026-07-31
      # and silently froze the feed for two weeks.
      - name: Build feed
        run: python scripts/build_feed.py
        env:
          FEED_BACKEND: openrouter
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Commit feed
        run: |
          git config user.name "feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/feed.json
          git diff --cached --quiet || git commit -m "feed: $(date -u +%F)"
          # main may have moved during the build (e.g. a sources.txt push);
          # feed.json is only ever written by this job, so rebase never conflicts
          git pull --rebase origin main
          git push
